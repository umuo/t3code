name: Fork Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish, e.g. v0.1.12-umuo.1 (defaults to v<apps/desktop/package.json version>)"
        required: false
        type: string
      prerelease:
        description: "Mark the GitHub Release as a prerelease"
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  actions: read

jobs:
  prepare:
    name: Prepare release metadata
    if: github.repository != 'pingdotgg/t3code'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      version: ${{ steps.resolve.outputs.version }}
      ref: ${{ steps.resolve.outputs.ref }}
      prerelease: ${{ steps.resolve.outputs.prerelease }}
      make_latest: ${{ steps.resolve.outputs.make_latest }}
    steps:
      - name: Checkout package manifest
        if: github.event_name == 'workflow_dispatch' && inputs.tag == ''
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          sparse-checkout: apps/desktop/package.json

      - id: resolve
        name: Resolve release metadata
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "push" ]]; then
            tag="$GITHUB_REF_NAME"
            prerelease="false"
            make_latest="true"
          else
            if [[ -n "$INPUT_TAG" ]]; then
              tag="$INPUT_TAG"
            else
              tag="v$(node -p "require('./apps/desktop/package.json').version")"
            fi
            prerelease="$INPUT_PRERELEASE"
            if [[ "$prerelease" == "true" ]]; then
              make_latest="false"
            else
              make_latest="true"
            fi
          fi

          if [[ "$tag" != v* ]]; then
            echo "::error::Release tag must start with 'v', got '$tag'." >&2
            exit 1
          fi

          version="${tag#v}"
          if [[ -z "$version" ]]; then
            echo "::error::Resolved release version is empty for tag '$tag'." >&2
            exit 1
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "ref=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          echo "make_latest=$make_latest" >> "$GITHUB_OUTPUT"

  build_bundle:
    name: Build JS bundle
    needs: [prepare]
    if: ${{ !cancelled() && needs.prepare.result == 'success' && github.repository != 'pingdotgg/t3code' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.prepare.outputs.ref }}
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup dependencies
        uses: ./.github/actions/setup-ci-deps
        with:
          install-args: --filter=t3... --filter=@t3tools/web... --filter=@t3tools/desktop... --filter=@t3tools/scripts...

      - name: Align package versions to release version
        run: node scripts/update-release-package-versions.ts "${{ needs.prepare.outputs.version }}"

      - name: Build JS bundle
        env:
          T3CODE_TELEMETRY_CHANNEL: dev
        run: vp run build:desktop:bundle

      - name: Upload JS bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: js-bundle
          path: |
            apps/server/dist
            apps/desktop/dist-electron
          if-no-files-found: error
          retention-days: 1

  desktop_mac_arm64:
    name: Desktop macOS arm64
    needs: [prepare, build_bundle]
    if: ${{ !cancelled() && needs.prepare.result == 'success' && needs.build_bundle.result == 'success' }}
    uses: ./.github/workflows/release-desktop.yml
    secrets: inherit
    with:
      version: ${{ needs.prepare.outputs.version }}
      ref: ${{ needs.prepare.outputs.ref }}
      release_channel: stable
      relay_client_tracing: false
      label: macOS arm64
      runner: macos-15
      platform: mac
      target: dmg
      arch: arm64
      rust_target: aarch64-apple-darwin
      resource_key: darwin-arm64
      cli_archive: true
      launch_check: false

  desktop_linux_x64:
    name: Desktop Linux x64
    needs: [prepare, build_bundle]
    if: ${{ !cancelled() && needs.prepare.result == 'success' && needs.build_bundle.result == 'success' }}
    uses: ./.github/workflows/release-desktop.yml
    secrets: inherit
    with:
      version: ${{ needs.prepare.outputs.version }}
      ref: ${{ needs.prepare.outputs.ref }}
      release_channel: stable
      relay_client_tracing: false
      label: Linux x64
      runner: ubuntu-24.04
      platform: linux
      target: AppImage
      arch: x64
      rust_target: x86_64-unknown-linux-gnu
      resource_key: linux-x64
      cli_archive: true
      launch_check: false

  desktop_win_x64:
    name: Desktop Windows x64
    needs: [prepare, build_bundle]
    if: ${{ !cancelled() && needs.prepare.result == 'success' && needs.build_bundle.result == 'success' }}
    uses: ./.github/workflows/release-desktop.yml
    secrets: inherit
    with:
      version: ${{ needs.prepare.outputs.version }}
      ref: ${{ needs.prepare.outputs.ref }}
      release_channel: stable
      relay_client_tracing: false
      label: Windows x64
      runner: ubuntu-24.04
      verify_runner: windows-2025
      platform: win
      target: nsis
      arch: x64
      rust_target: x86_64-pc-windows-msvc
      resource_key: win32-x64
      cli_archive: true

  release:
    name: Publish GitHub Release
    needs: [prepare, desktop_mac_arm64, desktop_linux_x64, desktop_win_x64]
    if: ${{ !failure() && !cancelled() && needs.prepare.result == 'success' && needs.desktop_mac_arm64.result == 'success' && needs.desktop_linux_x64.result == 'success' && needs.desktop_win_x64.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Download all desktop artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: desktop-*
          merge-multiple: true
          path: release-assets

      - name: Download all CLI archives
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: cli-*
          merge-multiple: true
          path: release-assets

      - name: Normalize updater manifests and write checksums
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets

          rm -f builder-debug.yml
          if [[ -f latest-win-x64.yml && ! -f latest.yml ]]; then
            mv latest-win-x64.yml latest.yml
          fi

          shopt -s nullglob
          archives=(*.dmg *.zip *.AppImage *.deb *.exe *.tar.gz)
          if [[ ${#archives[@]} -eq 0 ]]; then
            echo "No release assets were produced." >&2
            exit 1
          fi
          sha256sum "${archives[@]}" > SHA256SUMS
          cat SHA256SUMS

      - id: release_files
        name: Resolve release asset list
        shell: bash
        run: |
          set -euo pipefail
          {
            echo 'files<<EOF'
            for file in release-assets/*; do
              [[ -f "$file" ]] && echo "$file"
            done
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Publish release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          target_commitish: ${{ needs.prepare.outputs.ref }}
          name: T3 Code ${{ needs.prepare.outputs.tag }}
          generate_release_notes: true
          draft: false
          prerelease: ${{ needs.prepare.outputs.prerelease }}
          make_latest: ${{ needs.prepare.outputs.make_latest }}
          files: ${{ steps.release_files.outputs.files }}
          fail_on_unmatched_files: true
          token: ${{ github.token }}
